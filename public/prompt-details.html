<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompt Details - AuraPrompts</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav>
        <a href="index.html" class="logo">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--primary)">
                <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
            </svg>
            Aura<span>Prompts</span>
        </a>
        <button class="mobile-menu-btn" id="mobile-menu-btn">☰</button>
        <ul class="nav-links" id="nav-links">
            <li><a href="index.html" class="nav-home">Home</a></li>
            <li class="nav-item-dropdown">
                <a>Categories ▾</a>
                <div class="dropdown-menu" id="mega-menu-content">
                    <!-- Categories loaded dynamically here -->
                </div>
            </li>
            <li><a href="trending.html" class="nav-trending">Trending</a></li>
            <li><a href="latest.html" class="nav-latest">Latest</a></li>
            <li><a href="portraits.html" class="nav-portraits">Portraits</a></li>
            <li><a href="cinematic.html" class="nav-cinematic">Cinematic</a></li>
            <li><a href="admin.html" class="nav-admin-btn">⚡ Admin</a></li>
        </ul>
    </nav>

    <div class="screenshot-layout">
        <a href="index.html" style="display:inline-flex;align-items:center;gap:0.4rem;color:var(--muted-light);text-decoration:none;font-size:0.9rem;margin-bottom:1.5rem;transition:color 0.2s;" onmouseover="this.style.color='var(--primary-light)'" onmouseout="this.style.color='var(--muted-light)'">
            ← Back to Gallery
        </a>

        <h1 id="detail-title">Loading...</h1>

        <div class="screenshot-card">
            <div class="badge-prompt">✨ AI Prompt</div>
            <img id="detail-image" src="" alt="" style="display:none; margin-top:1rem;">

            <div style="margin-bottom:1.2rem;">
                <span id="detail-category" style="display:inline-block;background:rgba(168,85,247,0.15);border:1px solid rgba(168,85,247,0.3);color:var(--primary-light);font-size:0.8rem;font-weight:700;padding:0.25rem 0.8rem;border-radius:99px;text-transform:uppercase;letter-spacing:0.04em;"></span>
            </div>

            <button id="hide-btn" class="hide-prompt-btn">🙈 Hide Prompt</button>

            <p id="detail-prompt" class="prompt-paragraph">Loading prompt...</p>

            <div class="action-buttons">
                <button id="copy-btn"   class="action-btn btn-copy">📋 Copy</button>
                <button id="wa-btn"     class="action-btn btn-wa">💬 WhatsApp</button>
                <button id="tg-btn"     class="action-btn btn-tg">✈️ Telegram</button>
                <button id="gpt-btn"    class="action-btn btn-gpt">🤖 ChatGPT</button>
                <button id="gemini-btn" class="action-btn btn-gemini">🔵 Gemini</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
